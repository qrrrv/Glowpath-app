name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore stable app signing key
        env:
          GLOWPATH_KEYSTORE_BASE64: ${{ secrets.GLOWPATH_KEYSTORE_BASE64 }}
        run: |
          test -n "$GLOWPATH_KEYSTORE_BASE64"
          echo "$GLOWPATH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glowpath.keystore"

      - name: Build signed Debug APK
        env:
          GLOWPATH_KEYSTORE_PATH: ${{ runner.temp }}/glowpath.keystore
          GLOWPATH_KEYSTORE_PASSWORD: ${{ secrets.GLOWPATH_KEYSTORE_PASSWORD }}
          GLOWPATH_KEY_ALIAS: ${{ secrets.GLOWPATH_KEY_ALIAS }}
          GLOWPATH_KEY_PASSWORD: ${{ secrets.GLOWPATH_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowPath-debug
          path: app/build/outputs/apk/debug/*.apk
