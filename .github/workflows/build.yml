name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed Debug APK
        env:
          GLOWPATH_KEYSTORE_PATH: ${{ github.workspace }}/signing/glowpath.keystore
          GLOWPATH_KEYSTORE_PASSWORD: glowpath-public-signing-2026
          GLOWPATH_KEY_ALIAS: glowpath
          GLOWPATH_KEY_PASSWORD: glowpath-public-signing-2026
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowPath-debug
          path: app/build/outputs/apk/debug/*.apk
